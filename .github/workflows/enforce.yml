name: enforce

# Applies the central rules to every repository of each owner, one job per owner.
# One GitHub App with an installation per owner issues a short-lived installation
# token in every job (the key is the GH_MANAGER_APP_PRIVATE_KEY secret, the client ID
# the GH_MANAGER_APP_CLIENT_ID repository variable). See "Tokens" in the README.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "check = report only, fix = open/refresh pull requests"
        type: choice
        options: [check, fix]
        default: check
      repo:
        description: "Limit to one repository, OWNER/NAME (optional)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  enforce:
    name: enforce (${{ matrix.owner }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - owner: tyutyutyu
          - owner: tyutyutyu-org
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.GH_MANAGER_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_MANAGER_APP_PRIVATE_KEY }}
          owner: ${{ matrix.owner }}
      # Read-only tokens for the other owners' repositories (cross-repository file_sync
      # sources). The step of the job's own owner is skipped, its token is empty.
      - id: read-tyutyutyu
        if: matrix.owner != 'tyutyutyu'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.GH_MANAGER_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_MANAGER_APP_PRIVATE_KEY }}
          owner: tyutyutyu
          permission-contents: read
      - id: read-tyutyutyu-org
        if: matrix.owner != 'tyutyutyu-org'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.GH_MANAGER_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_MANAGER_APP_PRIVATE_KEY }}
          owner: tyutyutyu-org
          permission-contents: read
      - name: Apply rules
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_READ_TOKEN_TYUTYUTYU: ${{ steps.read-tyutyutyu.outputs.token }}
          GH_READ_TOKEN_TYUTYUTYU_ORG: ${{ steps.read-tyutyutyu-org.outputs.token }}
          OWNER: ${{ matrix.owner }}
          MODE: ${{ inputs.mode || 'fix' }}
          REPO: ${{ inputs.repo }}
        run: |
          if [ -n "$REPO" ] && [ "${REPO%%/*}" != "$OWNER" ]; then
            echo "Skipping: $REPO is not in $OWNER"
            exit 0
          fi
          # No --no-build: PyYAML has no wheel for this Python, so uv builds its sdist,
          # which --locked pins by the uv.lock hash. Keep these uv options identical to
          # the "Smoke-test the enforce start command" step in verify.yml.
          uv run --locked --no-dev github-manager "$MODE" --exit-zero --owner "$OWNER" ${REPO:+--repo "$REPO"}
