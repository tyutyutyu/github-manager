# Managed by github-manager (file_sync): do not edit here, change
# templates/backlog/backlog-verify.yml in the github-manager repository instead.
name: backlog-verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Tool versions are pinned here; Renovate updates them in the github-manager repository
  # (custom manager in its renovate.json), the managed repositories receive the new file.
  # renovate: datasource=npm depName=backlog.md
  BACKLOG_MD_VERSION: 1.57.1
  # renovate: datasource=npm depName=markdownlint-cli2
  MARKDOWNLINT_CLI2_VERSION: 0.24.2
  # renovate: datasource=pypi depName=yamllint
  YAMLLINT_VERSION: 1.38.0

jobs:
  verify:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"
      - name: Install the tools
        run: |
          npm install --global \
            "backlog.md@${BACKLOG_MD_VERSION}" \
            "markdownlint-cli2@${MARKDOWNLINT_CLI2_VERSION}"
          python -m pip install "yamllint==${YAMLLINT_VERSION}"
      # `backlog doctor` exits non-zero on a duplicate task ID or a dependency cycle. Backlog.md
      # skips a task file it cannot parse without changing the exit code and reports it only on
      # stderr when DEBUG is set, so the step fails on that message too. A failed remote
      # refresh (no credentials) only warns.
      - name: Read the Backlog.md project
        run: |
          log="${RUNNER_TEMP}/backlog-stderr.log"
          : > "${log}"
          status=0
          DEBUG=1 backlog doctor 2>> "${log}" || status=1
          DEBUG=1 backlog task list --plain 2>> "${log}" || status=1
          if grep -F "Failed to parse" "${log}"; then
            echo "::error::Backlog.md could not parse a task file"
            status=1
          fi
          exit "${status}"
      # Syntax-level rules only, so that the files generated by Backlog.md pass.
      - name: Lint YAML
        run: |
          yamllint -d '{rules: {key-duplicates: enable}}' .
      - name: Lint Markdown
        run: |
          cat > "${RUNNER_TEMP}/markdownlint.jsonc" <<'JSON'
          {
            "config": {
              "default": false,
              "MD011": true,
              "MD042": true,
              "MD052": true,
              "MD055": true,
              "MD056": true
            }
          }
          JSON
          markdownlint-cli2 --config "${RUNNER_TEMP}/markdownlint.jsonc" \
            "**/*.md" ".backlog/**/*.md" "#node_modules"
