# Central rules for the repositories of every account in `owners` (users or organizations).
# Archived repositories are always skipped; forks are skipped unless include_forks = true.
# Patterns in `exclude` (global or per rule) are shell globs matched against the repo
# name and against OWNER/NAME (e.g. "tyutyutyu-org/legacy-*").

owners = ["tyutyutyu", "tyutyutyu-org"]
exclude = [
    "tyutyutyu-org/tyutyutyu-bridge",
    "tyutyutyu-org/tyutyutyu-coding-agent",
    "tyutyutyu-org/update-notifier",
    "tyutyutyu/apple__site-finder",
    "tyutyutyu/battery-tracker-app",
    "tyutyutyu/bedrock-server-map",
    "tyutyutyu/docker-image-stats",
    "tyutyutyu/finance_assistant",
    "tyutyutyu/image-viewer",
    "tyutyutyu/java-feeds",
    "tyutyutyu/java-web-frameworks",
    "tyutyutyu/mese-app",
    "tyutyutyu/mese-doboz",
    "tyutyutyu/msps",
    "tyutyutyu/news-indexer-page-parsers",
    "tyutyutyu/pdf-titan",
    "tyutyutyu/photo-backup",
    "tyutyutyu/release-notes-news",
    "tyutyutyu/relevant-tools",
    "tyutyutyu/task-center",
    "tyutyutyu/tyutyutyu",
    "tyutyutyu/tyutyutyu-backup",
    "tyutyutyu/tyutyutyu-dashboard",
    "tyutyutyu/tyutyutyu-dashboard-extension",
    "tyutyutyu/tyutyutyu-ecosystem",
    "tyutyutyu/tyutyutyu-gcp-personal",
    "tyutyutyu/valiant-bridge",
    "tyutyutyu/video-converter",
    "tyutyutyu/video-converter-cluster",
    "tyutyutyu/yt-dlp-meta",
    "tyutyutyu/zenfocus",
    "tyutyutyu/zenget",
    "tyutyutyu/zenget-backlog",
    "tyutyutyu/zenget-registry",
]
include_forks = false

# One pull request per repository, from this branch. It is regenerated on every run.
branch = "feature/github-manager-compliance"
pr_title = "chore: align repository with central rules"
commit_message = "chore: align repository with central rules"

[[rules]]
id = "renovate-preset"
type = "renovate_preset"
# Shared preset kept in this repository: renovate/default.json
preset = "local>tyutyutyu/github-manager//renovate/default"
# Already included by the preset, so they are dropped from repository configs.
remove_extends = ["config:recommended", "config:base"]
exclude = []

[[rules]]
id = "gitignore-baseline"
type = "required_lines"
path = ".gitignore"
# Managed block between "# >>> github-manager: gitignore-baseline" and
# "# <<< github-manager: gitignore-baseline"; it is replaced as a whole.
lines = [".DS_Store", ".idea/", ".env", ".claude/", "!.claude/skills/"]
# Deleted from the rest of the file.
remove_lines = [".claude/autoharness/"]
exclude = []

[[rules]]
id = "branch-strategy"
type = "branch_strategy"
# Branches are repository settings: violations are reported, not fixed.
default_branch = "main"
forbidden_branches = ["develop"]
exclude = []

[[rules]]
id = "repo-settings"
type = "repo_settings"
# Repository settings: applied directly through the GitHub API (PyGithub), not by pull
# request. Needs a token with Administration: read/write.
settings = { delete_branch_on_merge = true, allow_auto_merge = true, allow_update_branch = true, has_wiki = false }
# Secret scanning and push protection: enforced on public repositories only (paid on
# private ones, which are skipped).
security_and_analysis = { secret_scanning = "enabled", secret_scanning_push_protection = "enabled" }
exclude = []

[[rules]]
id = "default-branch-ruleset"
type = "repo_ruleset"
# Ruleset "github-manager: default-branch-ruleset" on the default branch: no deletion, no
# force push, pull request required, no bypass actors. Applied directly, not by pull
# request. Other rulesets are left alone. Needs a token with Administration: read/write.
# Required checks per repository (glob on the name or OWNER/NAME); only names that report
# on the default branch, otherwise no pull request can be merged there.
required_status_checks = { "tyutyutyu/github-manager" = ["verify"], "tyutyutyu-org/ph_toolbox" = ["verify"], "tyutyutyu-org/youtube-mirror" = ["test"] }
strict_required_status_checks = false
exclude = []

[[rules]]
id = "repo-visibility"
type = "repo_visibility"
# Visibility per owner. Only reports a mismatch ([manual]); it never changes the
# visibility or transfers a repository.
visibility = { "tyutyutyu" = "public", "tyutyutyu-org" = "private" }
exclude = []

