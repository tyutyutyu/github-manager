# Central rules for the repositories of every account in `owners` (users or organizations).
# Archived repositories are always skipped; forks are skipped unless include_forks = true.
# Patterns in `exclude` (global or per rule) are shell globs matched against the repo
# name and against OWNER/NAME (e.g. "tyutyutyu-org/legacy-*").

owners = ["tyutyutyu", "tyutyutyu-org"]
exclude = [
    "tyutyutyu/apple__site-finder",
    "tyutyutyu/bedrock-server-map",
    "tyutyutyu/docker-image-stats",
    "tyutyutyu/finance_assistant",
    "tyutyutyu/image-viewer",
    "tyutyutyu/java-feeds",
    "tyutyutyu/java-web-frameworks",
    "tyutyutyu/mese-app",
    "tyutyutyu/mese-doboz",
    "tyutyutyu/news-indexer-page-parsers",
    "tyutyutyu/pdf-titan",
    "tyutyutyu/release-notes-news",
    "tyutyutyu/tyutyutyu",
    "tyutyutyu/tyutyutyu-dashboard-extension",
    "tyutyutyu/tyutyutyu-ecosystem",
    "tyutyutyu/tyutyutyu-gcp-personal",
    "tyutyutyu/valiant-bridge",
    "tyutyutyu/video-converter",
    "tyutyutyu/video-converter-cluster",
    "tyutyutyu/yt-dlp-meta",
    "tyutyutyu/zenfocus",
]
include_forks = false

# Repository profiles: exclusive and name based. A repository belongs to the one profile
# whose pattern (shell glob on the name or OWNER/NAME) matches it, otherwise to the
# implicit `common` profile; a repository matching two profiles is reported as an error.
# A rule applies only to the profiles in its `profiles` list (default: ["common"]).
profiles = { workspace = ["*-workspace"], backlog = ["*-backlog"] }

# Squash auto-merge of the pull request (only the squash merge method is allowed by the
# rules). It is turned on only in repositories where the repo_ruleset rule requires the
# `verify` check, after the settings and the ruleset are applied; elsewhere it is skipped.
auto_merge = true

# One pull request per repository, from this branch. It is regenerated on every run.
branch = "feature/github-manager-compliance"
pr_title = "chore: align repository with central rules"
commit_message = "chore: align repository with central rules"

[[rules]]
id = "renovate-preset"
type = "renovate_preset"
# Shared preset kept in this repository: renovate/default.json
preset = "local>tyutyutyu/github-manager//renovate/default"
# Already included by the preset, so they are dropped from repository configs.
remove_extends = ["config:recommended", "config:base"]
exclude = []
profiles = ["common", "workspace", "backlog"]

[[rules]]
id = "gitignore-baseline"
type = "required_lines"
path = ".gitignore"
# Managed block between "# >>> github-manager: gitignore-baseline" and
# "# <<< github-manager: gitignore-baseline"; it is replaced as a whole. One literal
# string, written line by line: no indentation, blank lines inside are kept.
lines = '''
# dotenv environment variable files
.env
.env.*
!.env.example

# Claude Code - local configuration
.claude/settings.local.json
CLAUDE.local.md

# ECC - temporary files
.observer-tmp/
.claude/worktrees/
.claude/scheduled_tasks.lock
'''
# Deleted from the rest of the file.
remove_lines = [".claude/autoharness/"]
exclude = []
profiles = ["common", "workspace", "backlog"]

[[rules]]
id = "gitattributes-baseline"
type = "required_lines"
path = ".gitattributes"
# Managed block between "# >>> github-manager: gitattributes-baseline" and
# "# <<< github-manager: gitattributes-baseline"; the rest of the file (repository
# specific attributes) is left untouched. Backlog.md files may end with a blank line.
lines = '''
.backlog/** whitespace=-blank-at-eof
'''
exclude = []
profiles = ["common", "workspace", "backlog"]

[[rules]]
id = "branch-strategy"
type = "branch_strategy"
# Branches are repository settings: violations are reported, not fixed.
default_branch = "main"
forbidden_branches = ["develop"]
exclude = []
profiles = ["common", "workspace", "backlog"]

[[rules]]
id = "repo-settings"
type = "repo_settings"
# Repository settings: applied directly through the GitHub REST API, not by pull
# request. Needs a token with Administration: read/write.
# Squash is the only allowed merge method (also in the default-branch-ruleset).
settings = { delete_branch_on_merge = true, allow_auto_merge = true, allow_update_branch = true, has_wiki = false, allow_squash_merge = true, allow_merge_commit = false, allow_rebase_merge = false }
# Secret scanning and push protection: enforced on public repositories only (paid on
# private ones, which are skipped).
security_and_analysis = { secret_scanning = "enabled", secret_scanning_push_protection = "enabled" }
exclude = []
profiles = ["common", "workspace", "backlog"]

[[rules]]
id = "default-branch-ruleset"
type = "repo_ruleset"
# Ruleset "github-manager: default-branch-ruleset" on the default branch: no deletion, no
# force push, pull request required (squash merge only), no bypass actors. Applied directly, not by pull
# request. Other rulesets are left alone. Needs a token with Administration: read/write.
# Required checks per repository (glob on the name or OWNER/NAME); only names that report
# on the default branch, otherwise no pull request can be merged there.
required_status_checks = {}
# The `verify` check is required only where a workflow on the default branch certainly runs
# it on pull requests; otherwise it is reported ([manual]) and left out. The check name is
# the job's `name:` (its id without one), not the workflow name or file name. A matrix job
# (`verify (<value>)`) and a reusable workflow call (`verify / <job>`) do not count, nor
# does a `pull_request` trigger with a `paths`/`paths-ignore` filter, one whose
# `branches` filter skips the default branch, or one whose `types` filter leaves out
# opened, synchronize or reopened. Case matters.
required_workflow_check = "verify"
strict_required_status_checks = true
exclude = []
profiles = ["common", "workspace", "backlog"]

[[rules]]
id = "repo-visibility"
type = "repo_visibility"
# Visibility per owner. Only reports a mismatch ([manual]); it never changes the
# visibility or transfers a repository.
visibility = { "tyutyutyu" = "public", "tyutyutyu-org" = "private" }
exclude = []
# Only the common profile; the workspace and backlog repositories are private, see
# profile-visibility.
profiles = ["common"]

[[rules]]
id = "profile-visibility"
type = "repo_visibility"
# Workspace and backlog repositories are private under both owners.
visibility = { "tyutyutyu" = "private", "tyutyutyu-org" = "private" }
exclude = []
profiles = ["workspace", "backlog"]

[[rules]]
id = "private-self-hosted-runners"
type = "self_hosted_runners"
# Private and internal repositories: every job must run on exactly one of these label
# sets. A single ubuntu-* label and a self-hosted label set that is not allowed (e.g.
# [self-hosted, Linux, X64, zhukov]) are replaced with `runs_on` in the pull request (only
# a one-line value; the rest of the file is left untouched). Anything else (windows-*,
# macos-*, unknown labels, expressions, matrices, mappings, multi-line or aliased values)
# is reported ([manual]).
allowed_runs_on = [["self-hosted"]]
# The value that replaces them; it must equal one of the allowed_runs_on sets.
runs_on = ["self-hosted"]
exclude = []
profiles = ["common", "workspace", "backlog"]

[[rules]]
id = "sonarqube-workflow"
type = "required_files"
# Common profile only: workspace and backlog repositories have no SonarQube analysis.
# Every tyutyutyu-org repository needs its own SonarQube workflow. Only the existence of
# the file is checked, not its content (it differs per project); a missing file is
# reported ([manual]) and nothing is written.
paths = [".github/workflows/sonarqube.yml"]
exclude = ["tyutyutyu/*"]

[[rules]]
id = "sonarqube-main-only"
type = "default_branch_push_only"
# The SonarQube Community Build analyses a single branch: an analysis of a pull request,
# Renovate or any other branch overwrites the result of main. So the SonarQube workflow
# may only run on pushes to the default branch (no pull_request, workflow_dispatch,
# schedule or other trigger). Deviations are reported ([manual]); nothing is written.
path = ".github/workflows/sonarqube.yml"
exclude = ["tyutyutyu/*"]

[[rules]]
id = "backlog-verify-workflow"
type = "file_sync"
# Backlog profile only: a shared verify workflow (Backlog.md CLI check and basic YAML and
# Markdown lint, no token). Without it the default-branch ruleset requires no check and
# the compliance pull requests are not auto-merged. The file is excluded from Renovate in
# the managed repositories (renovate/default.json); the template is updated here.
path = ".github/workflows/backlog-verify.yml"
source = "templates/backlog/backlog-verify.yml"
exclude = []
profiles = ["backlog"]

[[rules]]
id = "workspace-schema"
type = "file_sync"
# Workspace profile only: the JSON Schema of workspace.yaml is published by the easy-github
# repository and copied into the workspace repositories by the compliance pull request, so
# a change there reaches them with the next `fix` run. The verify workflow validates against it.
path = ".github/schemas/workspace.schema.json"
source_repo = "tyutyutyu-org/easy-github"
source = "schemas/workspace.schema.json"
profiles = ["workspace"]
exclude = []

[[rules]]
id = "workspace-verify-workflow"
type = "file_sync"
# Workspace profile only: a shared verify workflow (workspace.yaml schema and consistency
# check, basic YAML and Markdown lint, no token). Without it the default-branch ruleset
# requires no check and the compliance pull requests are not auto-merged. The file is
# excluded from Renovate in the managed repositories (renovate/default.json); the template
# is updated here.
path = ".github/workflows/workspace-verify.yml"
source = "templates/workspace/workspace-verify.yml"
profiles = ["workspace"]
exclude = []

[[rules]]
id = "workspace-members"
type = "workspace_members"
# Workspace profile only: every repository listed in workspace.yaml must exist and be
# readable (private ones and other owners included). Read-only: a missing member is
# reported ([manual]) and nothing is written. A member whose owner has no App
# installation is reported too, as it cannot be checked.
profiles = ["workspace"]
exclude = []

